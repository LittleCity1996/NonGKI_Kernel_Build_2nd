name: Build Xiaomi Mi 10S (MIUI 12) - alioth-r-oss
on:
  workflow_call:
  workflow_dispatch:
env:
  DEVICE_NAME: "xiaomi_mi10s"
  DEVICE_CODENAME: "thyme"
  CUSTOM_CMDS: "CLANG_TRIPLE=aarch64-linux-gnu- KCFLAGS=-Wno-error"
  EXTRA_CMDS: ""
  KERNEL_SOURCE: "https://github.com/UtsavBalar1231/kernel_xiaomi_sm8250.git"
  KERNEL_BRANCH: "alioth-r-oss"
  CLANG_SOURCE: "https://github.com/kdrag0n/proton-clang.git"
  CLANG_BRANCH: "master"
  GCC_GNU: true
  GCC_64_SOURCE: "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH: "android12L-release"
  GCC_32_SOURCE: "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH: "android12L-release"
  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME: "thyme_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false
  KERNELSU_SOURCE: ""
  KERNELSU_BRANCH: ""
  KERNELSU_AUTO_GET: "true"
  KERNELSU_AUTO_FORK: "resukisu"
  SUSFS_ENABLE: true
  SUSFS_FIXED: true
  AK3_SOURCE: "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH: "master"
  BOOT_SOURCE: ""
  NEED_DTBO: false
  NEED_SAFE_DTBO: false
  ROM_TEXT: "miui12_a11_alioth"
  PYTHON_VERSION: "3"
  PACK_METHOD: "Anykernel3"
  PACK_KMODULES: "false"
  KERNELSU_METHOD: "shell"
  PATCHES_SOURCE: "JackA1ltman/NonGKI_Kernel_Patches"
  PATCHES_BRANCH: "mi_kernel"
  SUSFS_FOLDER_FIXED: ""
  SUSFS_PATCH_FIXED: ""
  REKERNEL_ENABLE: "false"
  HOOK_METHOD: "syscall"
  KERNEL_PATCH: "false"
  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux"
  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"
  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom"
  BUILD_DEBUGGER: "false"
  SKIP_PATCH: "true"
  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: ""
  FREE_MORE_SPACE: "false"
jobs:
  build-kernel:
    name: Xiaomi Mi 10S (MIUI 12) - alioth-r-oss
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Compilation environment preparation
        uses: ./.github/workflows/build-env
      - name: Fix Proton Clang ld compatibility
        shell: bash
        run: |
          rm -f $GITHUB_WORKSPACE/clang-custom/bin/ld
      - name: Get necessary tools
        uses: ./.github/workflows/build-ready
      - name: Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs
      - name: Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe
      - name: Patch Kernel of ReKernel
        uses: ./.github/workflows/patch-rekernel
      - name: Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard
      - name: Fix implicit-int compile errors
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          sed -i 's/^static hdl_count = 0;$/static int hdl_count = 0;/' techpack/camera/drivers/cam_req_mgr/cam_req_mgr_util.c
          sed -i 's/^struct target_if_ctx \*target_if_get_ctx()$/struct target_if_ctx *target_if_get_ctx(void)/' drivers/staging/qca-wifi-host-cmn/target_if/core/src/target_if_main.c
          sed -i 's/extern in_long_press;/extern int in_long_press;/' arch/arm64/kernel/smp.c
          sed -i 's/static char \*hw_item_dump()/static char *hw_item_dump(void)/' arch/arm64/kernel/hwconf_manager.c
          # mkdtboimg.py：python2->python3 兼容
          sed -i 's/cmd_mkdtimg = python2/cmd_mkdtimg = python3/' scripts/Makefile.lib
          sed -i 's/\bxrange\b/range/g' scripts/dtc/mkdtboimg.py
          sed -i 's/dt_entry_buf = ""/dt_entry_buf = b""/' scripts/dtc/mkdtboimg.py
          sed -i "s/array('c', ' ' \* self.__metadata_size)/array('B', b'\\\\x00' * self.__metadata_size)/" scripts/dtc/mkdtboimg.py
          sed -i 's/if version is 0:/if version == 0:/' scripts/dtc/mkdtboimg.py
          sed -i 's|self.dt_entries_offset / 4|self.dt_entries_offset // 4|' scripts/dtc/mkdtboimg.py
          sed -i 's|(self.dt_entries_offset - self._DT_TABLE_HEADER_SIZE) / 4|(self.dt_entries_offset - self._DT_TABLE_HEADER_SIZE) // 4|' scripts/dtc/mkdtboimg.py

      - name: Build Process
        uses: ./.github/workflows/build-process
      - name: Pack Process
        uses: ./.github/workflows/pack-process
      - name: Upload Artifacts
        uses: ./.github/workflows/upload-files
